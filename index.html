function freshness(date, cat) {
  const days = Math.floor((Date.now()-new Date(date).getTime())/86400000);
  const isFresh = cat==="fresh";
  if(isFresh){ if(days<=1)return{color:C.green,label:days===0?"今日":"昨日",dot:"🟢"}; if(days<=3)return{color:C.yellow,label:`${days}日前`,dot:"🟡"}; return{color:C.coral,label:`${days}日前`,dot:"🔴"}; }
  if(days<=7)return{color:C.green,label:days===0?"今日":`${days}日前`,dot:"🟢"};
  if(days<=30)return{color:C.yellow,label:`${days}日前`,dot:"🟡"};
  return{color:C.coral,label:`${days}日前`,dot:"🔴"};
}
const getBest = prices => prices.length ? Math.min(...prices.map(p=>p.price)) : 0;

// ── PRODUCT CARD ──────────────────────────────────────────────────────────────
function ProductCard({product,onClick}){
  const prices = product.price_records || [];
  const best = getBest(prices);
  const latest = prices.length ? [...prices].sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at))[0] : null;
  const f = latest ? freshness(latest.recorded_at, product.category) : null;
  const cat = CATEGORIES.find(c=>c.id===product.category);
  const hasPromo = prices.some(p=>p.promo&&p.promo_expiry&&new Date(p.promo_expiry)>new Date());
  return <div onClick={onClick} style={{background:C.white,borderRadius:16,padding:16,marginBottom:10,boxShadow:"0 2px 8px rgba(23,107,104,0.07)",cursor:"pointer",border:"1px solid #EAE8E3"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
      <div style={{flex:1}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4,flexWrap:"wrap"}}>
          <span style={{fontSize:12}}>{cat?.emoji}</span>
          <span style={{fontSize:12,color:C.muted}}>{cat?.label}</span>
          {product.brand&&<span style={{fontSize:12,background:C.tealLight,color:C.teal,borderRadius:6,padding:"1px 7px",fontWeight:600}}>{product.brand}</span>}
          {hasPromo&&<span style={{fontSize:11,background:C.coral,color:"#fff",borderRadius:6,padding:"1px 6px",fontWeight:600}}>優惠</span>}
        </div>
        <div style={{fontSize:16,fontWeight:700,color:C.text,marginBottom:4}}>{product.name}</div>
        {latest && f && <div style={{fontSize:12,color:f.color}}>{f.dot} {f.label} · {latest.shop}</div>}
        {!latest && <div style={{fontSize:12,color:C.muted}}>未有價格記錄</div>}
      </div>
      <div style={{textAlign:"right",minWidth:65}}>
        {prices.length > 0 && <><div style={{fontSize:22,fontWeight:800,color:C.teal}}>${best}</div><div style={{fontSize:11,color:C.muted}}>最低價</div></>}
      </div>
    </div>
  </div>;
}

// ── PRODUCT DETAIL ────────────────────────────────────────────────────────────
function ProductDetail({product:init, onBack, user, onUpdate}){
  const [product, setProduct] = useState(init);
  const [editingPrice, setEditingPrice] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [sortBy, setSortBy] = useState("price");
  const [filterDistrict, setFilterDistrict] = useState("");
  const [loading, setLoading] = useState(false);

  const cat = CATEGORIES.find(c=>c.id===product.category);
  const prices = product.price_records || [];
  const best = getBest(prices);
  const districts = [...new Set(prices.map(p=>p.district).filter(Boolean))];

  let display = [...prices];
  if(filterDistrict) display = display.filter(p=>p.district===filterDistrict);
  if(sortBy==="price") display.sort((a,b)=>a.price-b.price);
  if(sortBy==="date") display.sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at));
  if(sortBy==="district") display.sort((a,b)=>(a.district||"").localeCompare(b.district||""));
  if(sortBy==="shop") display.sort((a,b)=>a.shop.localeCompare(b.shop));

  const deletePrice = async (id) => {
    setLoading(true);
    await supabase.from("price_records").delete().eq("id", id);
    const updated = {...product, price_records: prices.filter(p=>p.id!==id)};
    setProduct(updated);
    onUpdate(updated);
    setConfirmDelete(null);
    setLoading(false);
  };

  const saveEdit = async (id, data) => {
    setLoading(true);
    const {data:updated} = await supabase.from("price_records").update({
      price: data.price, shop: data.shop, district: data.district,
      sub_location: data.subLocation, promo: data.promo,
      promo_expiry: data.promoExpiry || null
    }).eq("id", id).select().single();
    if(updated) {
      const newPrices = prices.map(p=>p.id===id?{...p,...updated}:p);
      const newProduct = {...product, price_records: newPrices};
      setProduct(newProduct);
      onUpdate(newProduct);
    }
    setEditingPrice(null);
    setLoading(false);
  };

  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={{background:C.teal,padding:"52px 20px 20px"}}>
      <button onClick={onBack} style={{background:"none",border:"none",color:"#fff",fontSize:15,cursor:"pointer",marginBottom:10,padding:0}}>← 返回</button>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{flex:1}}>
          {product.brand&&<div style={{fontSize:13,color:C.yellow,marginBottom:2,fontWeight:700}}>{product.brand}</div>}
          <div style={{fontSize:13,color:"rgba(255,255,255,0.65)"}}>{cat?.emoji} {cat?.label}</div>
          <div style={{fontSize:19,fontWeight:800,color:"#fff",marginTop:2}}>{product.name}</div>
        </div>
        {prices.length>0&&<div style={{textAlign:"right"}}>
          <div style={{fontSize:30,fontWeight:900,color:C.yellow}}>${best}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.65)"}}>最低見過</div>
        </div>}
      </div>
    </div>
    <div style={{padding:16}}>
      {prices.length>0&&<div style={{background:C.white,borderRadius:14,padding:12,marginBottom:14}}>
        <div style={{fontSize:12,color:C.muted,marginBottom:8}}>排序</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
          {[["price","價格"],["date","日期"],["district","地區"],["shop","店鋪"]].map(([v,l])=><button key={v} onClick={()=>setSortBy(v)} style={{padding:"5px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:13,background:sortBy===v?C.teal:C.bg,color:sortBy===v?"#fff":C.text}}>{l}</button>)}
        </div>
        {districts.length>0&&<><div style={{fontSize:12,color:C.muted,marginBottom:8}}>地區 Filter</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <button onClick={()=>setFilterDistrict("")} style={{padding:"5px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:13,background:filterDistrict===""?C.teal:C.bg,color:filterDistrict===""?"#fff":C.text}}>全部</button>
          {districts.map(d=><button key={d} onClick={()=>setFilterDistrict(d)} style={{padding:"5px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:13,background:filterDistrict===d?C.teal:C.bg,color:filterDistrict===d?"#fff":C.text}}>{d}</button>)}
        </div></>}
      </div>}

      <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:10}}>價格記錄 ({display.length})</div>

      {display.map(p=>{
        const f = freshness(p.recorded_at, product.category);
        const promoActive = p.promo&&p.promo_expiry&&new Date(p.promo_expiry)>new Date();
        const promoExpired = p.promo&&p.promo_expiry&&new Date(p.promo_expiry)<=new Date();
        const isBest = p.price===best;
        const isMe = user && p.user_id===user.id;

        if(editingPrice===p.id) return <EditForm key={p.id} price={p} onSave={d=>saveEdit(p.id,d)} onCancel={()=>setEditingPrice(null)}/>;
        if(confirmDelete===p.id) return <div key={p.id} style={{background:"#FFF0EE",borderRadius:14,padding:16,marginBottom:10,border:`2px solid ${C.coral}`}}>
          <div style={{fontWeight:700,color:C.text,marginBottom:4}}>確定刪除呢條記錄？</div>
          <div style={{fontSize:14,color:C.muted,marginBottom:14}}>{p.shop} · ${p.price}</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setConfirmDelete(null)} style={{flex:1,background:C.bg,border:"none",borderRadius:10,padding:10,cursor:"pointer"}}>取消</button>
            <button onClick={()=>deletePrice(p.id)} disabled={loading} style={{flex:1,background:C.coral,border:"none",borderRadius:10,padding:10,cursor:"pointer",color:"#fff",fontWeight:700}}>確定刪除</button>
          </div>
        </div>;

        return <div key={p.id} style={{background:C.white,borderRadius:14,padding:14,marginBottom:10,border:isBest?`2px solid ${C.teal}`:"1px solid #EAE8E3"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3,flexWrap:"wrap"}}>
                <span style={{fontWeight:700,fontSize:15,color:C.text}}>{p.shop}</span>
                {isBest&&<span style={{fontSize:11,background:C.teal,color:"#fff",borderRadius:6,padding:"1px 7px"}}>最平</span>}
              </div>
              {p.district&&<div style={{fontSize:12,color:C.muted,marginBottom:2}}>📍 {p.region&&`${p.region} · `}{p.district}{p.sub_location&&` · ${p.sub_location}`}</div>}
              <div style={{fontSize:12,color:C.muted,marginBottom:3}}>👤 {p.user_name} · <span style={{fontSize:11}}>記錄者</span></div>
              <div style={{fontSize:12,color:f.color}}>{f.dot} {f.label}</div>
              {promoActive&&<div style={{fontSize:12,color:C.coral,marginTop:3,fontWeight:600}}>🎁 {p.promo} · 至 {new Date(p.promo_expiry).toLocaleDateString("zh-HK")}</div>}
              {promoExpired&&<div style={{fontSize:12,color:C.muted,marginTop:3}}>⏰ {p.promo}（已過期）</div>}
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
              <div style={{fontSize:24,fontWeight:800,color:isBest?C.teal:C.text}}>${p.price}</div>
              <div style={{display:"flex",gap:6}}>
                {isMe?<>
                  <button onClick={()=>setEditingPrice(p.id)} style={{background:C.tealLight,border:"none",borderRadius:8,padding:"4px 10px",cursor:"pointer",fontSize:12,color:C.teal}}>✏️ 改</button>
                  <button onClick={()=>setConfirmDelete(p.id)} style={{background:"#FFF0EE",border:"none",borderRadius:8,padding:"4px 10px",cursor:"pointer",fontSize:12,color:C.coral}}>🗑️</button>
                </>:<button onClick={()=>alert("已收到檢舉，感謝！")} style={{background:C.bg,border:"none",borderRadius:8,padding:"4px 10px",cursor:"pointer",fontSize:12,color:C.muted}}>🚩</button>}
              </div>
            </div>
          </div>
        </div>;
      })}
      <button onClick={()=>alert("請用底部➕記錄按鈕加入新價格")} style={{width:"100%",background:C.yellow,border:"none",borderRadius:14,padding:16,fontSize:16,fontWeight:700,color:C.teal,cursor:"pointer",marginTop:4}}>＋ 加入新價格記錄</button>
    </div>
  </div>;
}

// ── ADD SCREEN ────────────────────────────────────────────────────────────────
function AddScreen({user, onAdded}){
  const [step,setStep]=useState(1);
  const [loc,setLoc]=useState(null);
  const [f,setF]=useState({name:"",brand:"",category:"",shopType:"",shopName:"",price:"",promo:false,promoType:"",promoExpiry:""});
  const [saving,setSaving]=useState(false);
  const [success,setSuccess]=useState(false);
  const u=(k,v)=>setF(prev=>({...prev,[k]:v}));
  const autoShop=loc&&f.shopType&&f.shopType!=="自訂"?`${f.shopType}・${loc.subLocation}・${loc.district}`:f.shopName;

  const handleSave = async () => {
    setSaving(true);
    try {
      // 搵或建立產品
      let productId;
      const {data:existing} = await supabase.from("products").select("id").eq("name",f.name).eq("brand",f.brand||"").maybeSingle();
      if(existing) {
        productId = existing.id;
      } else {
        const {data:newProduct} = await supabase.from("products").insert({name:f.name,brand:f.brand||null,category:f.category}).select().single();
        productId = newProduct.id;
      }
      // 加入價格記錄
      await supabase.from("price_records").insert({
        product_id: productId,
        user_id: user.id,
        user_name: user.user_metadata?.full_name || user.email,
        price: Number(f.price),
        region: loc?.region || null,
        district: loc?.district || null,
        sub_location: loc?.subLocation || null,
        shop: f.shopName || autoShop,
        promo: f.promo ? f.promoType : null,
        promo_expiry: f.promo && f.promoExpiry ? f.promoExpiry : null,
      });
      setSuccess(true);
      onAdded();
      setTimeout(()=>{
        setSuccess(false);
        setStep(1);
        setLoc(null);
        setF({name:"",brand:"",category:"",shopType:"",shopName:"",price:"",promo:false,promoType:"",promoExpiry:""});
      }, 1500);
    } catch(e) {
      alert("儲存失敗，請重試");
    }
    setSaving(false);
  };

  if(success) return <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
    <div style={{fontSize:60,marginBottom:16}}>✅</div>
    <div style={{fontSize:20,fontWeight:700,color:C.teal}}>記錄成功！</div>
  </div>;

  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={{background:C.teal,padding:"52px 20px 20px"}}>
      <div style={{fontSize:19,fontWeight:800,color:"#fff",marginBottom:12}}>記錄價格</div>
      <div style={{display:"flex",gap:6,marginBottom:6}}>
        {[1,2,3].map(s=><div key={s} style={{flex:1,height:4,borderRadius:2,background:s<=step?C.yellow:"rgba(255,255,255,0.25)"}}/>)}
      </div>
      <div style={{fontSize:12,color:"rgba(255,255,255,0.65)"}}>{["第1步：產品資料","第2步：購買地點","第3步：價格詳情"][step-1]}</div>
    </div>
    <div style={{padding:16}}>
      {step===1&&<div>
        {[["name","產品名稱","e.g. 蘇打水 12罐"],["brand","品牌（選填）","e.g. 彩明、可口可樂"]].map(([k,l,ph])=><div key={k} style={{background:C.white,borderRadius:14,padding:14,marginBottom:10}}>
          <div style={{fontSize:13,color:C.muted,marginBottom:6}}>{l}</div>
          <input value={f[k]} onChange={e=>u(k,e.target.value)} placeholder={ph} style={{width:"100%",border:"none",outline:"none",fontSize:16,color:C.text,background:"transparent",boxSizing:"border-box"}}/>
        </div>)}
        <div style={{background:C.white,borderRadius:14,padding:14,marginBottom:20}}>
          <div style={{fontSize:13,color:C.muted,marginBottom:10}}>分類</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {CATEGORIES.map(c=><button key={c.id} onClick={()=>u("category",c.id)} style={{padding:"7px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:13,background:f.category===c.id?C.teal:C.bg,color:f.category===c.id?"#fff":C.text,fontWeight:f.category===c.id?700:400}}>{c.emoji} {c.label}</button>)}
          </div>
        </div>
        <button onClick={()=>f.name&&f.category&&setStep(2)} style={{width:"100%",background:f.name&&f.category?C.yellow:"#ccc",border:"none",borderRadius:14,padding:16,fontSize:16,fontWeight:700,color:C.teal,cursor:f.name&&f.category?"pointer":"not-allowed"}}>下一步 →</button>
      </div>}

      {step===2&&<div>
        <LocationPicker onSelect={setLoc}/>
        {loc&&<div>
          <div style={{background:C.tealLight,borderRadius:14,padding:14,marginBottom:14}}>
            <div style={{fontSize:13,color:C.teal,fontWeight:700,marginBottom:4}}>✅ 已選地點</div>
            <div style={{fontSize:14,color:C.text}}>📍 {loc.region} · {loc.district} · {loc.subLocation}</div>
          </div>
          <div style={{background:C.white,borderRadius:14,padding:14,marginBottom:14}}>
            <div style={{fontSize:13,color:C.muted,marginBottom:10}}>店鋪類型</div>
            {CHAIN_STORES.map(cs=><div key={cs.type} style={{marginBottom:8}}>
              <div style={{fontSize:11,color:C.muted,marginBottom:6,fontWeight:600}}>{cs.type}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {cs.stores.map(s=><button key={s} onClick={()=>{u("shopType",s);if(s!=="自訂")u("shopName",`${s}・${loc.subLocation}・${loc.district}`);}} style={{padding:"6px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:13,background:f.shopType===s?C.teal:C.bg,color:f.shopType===s?"#fff":C.text}}>{s}</button>)}
              </div>
            </div>)}
          </div>
          <div style={{background:C.white,borderRadius:14,padding:14,marginBottom:20}}>
            <div style={{fontSize:13,color:C.muted,marginBottom:6}}>店鋪全名（可修改）</div>
            <input value={f.shopName||autoShop} onChange={e=>u("shopName",e.target.value)} style={{width:"100%",border:"none",outline:"none",fontSize:15,color:C.text,background:"transparent",boxSizing:"border-box"}}/>
          </div>
        </div>}
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setStep(1)} style={{flex:1,background:C.bg,border:"none",borderRadius:14,padding:16,fontSize:15,color:C.text,cursor:"pointer"}}>← 返回</button>
          <button onClick={()=>loc&&f.shopType&&setStep(3)} style={{flex:2,background:loc&&f.shopType?C.yellow:"#ccc",border:"none",borderRadius:14,padding:16,fontSize:16,fontWeight:700,color:C.teal,cursor:loc&&f.shopType?"pointer":"not-allowed"}}>下一步 →</button>
        </div>
      </div>}

      {step===3&&<div>
        <div style={{background:C.white,borderRadius:14,padding:14,marginBottom:10}}>
          <div style={{fontSize:13,color:C.muted,marginBottom:6}}>價格 ($)</div>
          <input type="number" value={f.price} onChange={e=>u("price",e.target.value)} placeholder="0" style={{width:"100%",border:"none",outline:"none",fontSize:32,fontWeight:800,color:C.teal,background:"transparent",boxSizing:"border-box"}}/>
        </div>
        <div style={{background:C.white,borderRadius:14,padding:14,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:15,fontWeight:600,color:C.text}}>有優惠？</span>
            <button onClick={()=>u("promo",!f.promo)} style={{width:44,height:26,borderRadius:13,border:"none",cursor:"pointer",background:f.promo?C.coral:"#ccc",position:"relative"}}>
              <div style={{width:20,height:20,borderRadius:10,background:"#fff",position:"absolute",top:3,left:f.promo?21:3,transition:"left 0.2s"}}/>
            </button>
          </div>
          {f.promo&&<div style={{marginTop:12}}>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
              {["特價","買一送一","第二件半價","限時優惠"].map(t=><button key={t} onClick={()=>u("promoType",t)} style={{padding:"6px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:13,background:f.promoType===t?C.coral:C.bg,color:f.promoType===t?"#fff":C.text}}>{t}</button>)}
            </div>
            <div style={{fontSize:13,color:C.muted,marginBottom:6}}>優惠到期日</div>
            <input type="date" value={f.promoExpiry} onChange={e=>u("promoExpiry",e.target.value)} style={{width:"100%",border:"1px solid #EAE8E3",borderRadius:10,padding:"8px 12px",fontSize:15,outline:"none",boxSizing:"border-box"}}/>
          </div>}
        </div>
        <div style={{background:C.tealLight,borderRadius:14,padding:14,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:C.teal,marginBottom:8}}>確認記錄</div>
          {[["產品",`${f.brand?f.brand+" · ":""}${f.name}`],["地點",loc?`${loc.region} · ${loc.district} · ${loc.subLocation}`:"-"],["店鋪",f.shopName||autoShop||"-"],["價格",f.price?`$${f.price}`:"-"]].map(([l,v])=><div key={l} style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
            <span style={{color:C.muted}}>{l}</span>
            <span style={{color:C.text,fontWeight:600,textAlign:"right",maxWidth:"60%"}}>{v}</span>
          </div>)}
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setStep(2)} style={{flex:1,background:C.bg,border:"none",borderRadius:14,padding:16,fontSize:15,color:C.text,cursor:"pointer"}}>← 返回</button>
          <button onClick={handleSave} disabled={!f.price||saving} style={{flex:2,background:f.price&&!saving?C.teal:"#ccc",border:"none",borderRadius:14,padding:16,fontSize:16,fontWeight:700,color:"#fff",cursor:f.price&&!saving?"pointer":"not-allowed"}}>{saving?"儲存中...":"✅ 儲存記錄"}</button>
        </div>
      </div>}
    </div>
  </div>;
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function SearchScreen({products,setSelectedProduct}){
  const [q,setQ]=useState("");
  const [fCat,setFCat]=useState("");
  const [fRegion,setFRegion]=useState("");
  const [fDist,setFDist]=useState("");
  const [sort,setSort]=useState("name");
  const regionData=DISTRICTS.find(d=>d.region===fRegion);
  const distNames=regionData?.areas.map(a=>a.name)||[];
  let filtered=products.filter(p=>(p.name.toLowerCase().includes(q.toLowerCase())||(p.brand&&p.brand.toLowerCase().includes(q.toLowerCase())))&&(fCat===""||p.category===fCat)&&(fRegion===""||p.price_records?.some(pr=>pr.region===fRegion))&&(fDist===""||p.price_records?.some(pr=>pr.district===fDist)));
  if(sort==="price")filtered.sort((a,b)=>getBest(a.price_records||[])-getBest(b.price_records||[]));
  if(sort==="name")filtered.sort((a,b)=>a.name.localeCompare(b.name));
  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={{background:C.teal,padding:"52px 20px 16px"}}>
      <div style={{fontSize:19,fontWeight:800,color:"#fff",marginBottom:12}}>搜尋產品</div>
      <div style={{background:"rgba(255,255,255,0.15)",borderRadius:12,display:"flex",alignItems:"center",padding:"10px 14px",gap:8}}>
        <span style={{color:"rgba(255,255,255,0.6)"}}>🔍</span>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="搜尋產品名 / 品牌..." style={{background:"none",border:"none",outline:"none",color:"#fff",fontSize:16,flex:1}}/>
      </div>
    </div>
    <div style={{background:C.white,padding:"10px 12px",borderBottom:"1px solid #EAE8E3"}}>
      <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:8}}>
        <button onClick={()=>setFCat("")} style={{padding:"6px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:12,whiteSpace:"nowrap",background:fCat===""?C.teal:C.bg,color:fCat===""?"#fff":C.text}}>全部分類</button>
        {CATEGORIES.map(c=><button key={c.id} onClick={()=>setFCat(c.id)} style={{padding:"6px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:12,whiteSpace:"nowrap",background:fCat===c.id?C.teal:C.bg,color:fCat===c.id?"#fff":C.text}}>{c.emoji} {c.label}</button>)}
      </div>
      <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:8}}>
        <button onClick={()=>{setFRegion("");setFDist("");}} style={{padding:"6px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:12,whiteSpace:"nowrap",background:fRegion===""?C.teal:C.bg,color:fRegion===""?"#fff":C.text}}>全部地區</button>
        {DISTRICTS.map(d=><button key={d.region} onClick={()=>{setFRegion(d.region);setFDist("");}} style={{padding:"6px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:12,whiteSpace:"nowrap",background:fRegion===d.region?C.teal:C.bg,color:fRegion===d.region?"#fff":C.text}}>{d.region}</button>)}
      </div>
      {fRegion&&<div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:8}}>
        <button onClick={()=>setFDist("")} style={{padding:"6px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:12,whiteSpace:"nowrap",background:fDist===""?C.teal:C.bg,color:fDist===""?"#fff":C.text}}>所有{fRegion}</button>
        {distNames.map(d=><button key={d} onClick={()=>setFDist(d)} style={{padding:"6px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:12,whiteSpace:"nowrap",background:fDist===d?C.teal:C.bg,color:fDist===d?"#fff":C.text}}>{d}</button>)}
      </div>}
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <span style={{fontSize:12,color:C.muted}}>排序：</span>
        {[["name","名稱"],["price","最低價"]].map(([v,l])=><button key={v} onClick={()=>setSort(v)} style={{padding:"5px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:12,background:sort===v?C.teal:C.bg,color:sort===v?"#fff":C.text}}>{l}</button>)}
      </div>
    </div>
    <div style={{padding:"12px 16px"}}>
      {filtered.length===0?<div style={{textAlign:"center",padding:40,color:C.muted}}><div style={{fontSize:36,marginBottom:10}}>🔍</div>冇搵到相關產品</div>:filtered.map(p=><ProductCard key={p.id} product={p} onClick={()=>setSelectedProduct(p)}/>)}
    </div>
  </div>;
}

// ── BOOKMARKS ─────────────────────────────────────────────────────────────────
function BookmarksScreen({products,setSelectedProduct,user}){
  const [bookmarkIds,setBookmarkIds]=useState([]);
  useEffect(()=>{
    if(!user) return;
    supabase.from("bookmarks").select("product_id").eq("user_id",user.id).then(({data})=>{
      if(data) setBookmarkIds(data.map(b=>b.product_id));
    });
  },[user]);
  const bm=products.filter(p=>bookmarkIds.includes(p.id));
  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={{background:C.teal,padding:"52px 20px 24px"}}>
      <div style={{fontSize:19,fontWeight:800,color:"#fff"}}>常買清單 🔖</div>
      <div style={{fontSize:13,color:"rgba(255,255,255,0.65)",marginTop:4}}>長按產品可加入／移除</div>
    </div>
    <div style={{padding:16}}>
      {bm.length===0?<div style={{textAlign:"center",padding:40,color:C.muted}}><div style={{fontSize:36,marginBottom:10}}>🔖</div>未有常買清單</div>:bm.map(p=><ProductCard key={p.id} product={p} onClick={()=>setSelectedProduct(p)}/>)}
    </div>
  </div>;
}

// ── PROFILE ───────────────────────────────────────────────────────────────────
function ProfileScreen({user, products, onLogout}){
  const [myRecords,setMyRecords]=useState([]);
  useEffect(()=>{
    if(!user) return;
    supabase.from("price_records").select("*, products(name,brand,category)").eq("user_id",user.id).order("recorded_at",{ascending:false}).then(({data})=>{
      if(data) setMyRecords(data);
    });
  },[user]);

  const handleLogout = async () => {
    await supabase.auth.signOut();
    onLogout();
  };

  const displayName = user?.user_metadata?.full_name || user?.email || "用戶";
  const avatar = user?.user_metadata?.avatar_url;

  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={{background:C.teal,padding:"52px 20px 28px"}}>
      <div style={{display:"flex",alignItems:"center",gap:16}}>
        {avatar?<img src={avatar} style={{width:64,height:64,borderRadius:32,objectFit:"cover"}} alt="avatar"/>:<div style={{width:64,height:64,borderRadius:32,background:C.yellow,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:800,color:C.teal}}>{displayName[0]}</div>}
        <div style={{flex:1}}>
          <div style={{fontSize:20,fontWeight:800,color:"#fff"}}>{displayName}</div>
          <div style={{fontSize:13,color:"rgba(255,255,255,0.65)",marginTop:2}}>{user?.email}</div>
        </div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:20}}>
        {[{l:"我的記錄",v:myRecords.length},{l:"追蹤產品",v:products.length},{l:"貢獻排名",v:"#1"}].map(s=><div key={s.l} style={{flex:1,background:"rgba(255,255,255,0.12)",borderRadius:12,padding:"10px 8px",textAlign:"center"}}>
          <div style={{fontSize:20,fontWeight:800,color:"#fff"}}>{s.v}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.65)"}}>{s.l}</div>
        </div>)}
      </div>
    </div>
    <div style={{padding:16}}>
      <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:10}}>我的記錄</div>
      {myRecords.length===0?<div style={{textAlign:"center",padding:30,color:C.muted}}>未有記錄</div>:myRecords.map((r,i)=>{
        const f=freshness(r.recorded_at, r.products?.category);
        const cat=CATEGORIES.find(c=>c.id===r.products?.category);
        return <div key={i} style={{background:C.white,borderRadius:14,padding:14,marginBottom:10,border:"1px solid #EAE8E3"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                <span style={{fontSize:12}}>{cat?.emoji}</span>
                {r.products?.brand&&<span style={{fontSize:12,background:C.tealLight,color:C.teal,borderRadius:6,padding:"1px 7px",fontWeight:600}}>{r.products.brand}</span>}
              </div>
              <div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:3}}>{r.products?.name}</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:2}}>📍 {r.shop}</div>
              <div style={{fontSize:12,color:f.color}}>{f.dot} {f.label}</div>
              {r.promo&&r.promo_expiry&&new Date(r.promo_expiry)>new Date()&&<div style={{fontSize:12,color:C.coral,marginTop:2,fontWeight:600}}>🎁 {r.promo}</div>}
            </div>
            <div style={{fontSize:22,fontWeight:800,color:C.teal}}>${r.price}</div>
          </div>
        </div>;
      })}
      <div style={{fontSize:14,fontWeight:700,color:C.text,margin:"20px 0 10px"}}>設定</div>
      {[{i:"🔔",l:"通知設定"},{i:"🔒",l:"私隱設定"},{i:"🚩",l:"我的檢舉記錄"}].map(s=><div key={s.l} style={{background:C.white,borderRadius:14,padding:16,marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer"}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}><span style={{fontSize:20}}>{s.i}</span><span style={{fontSize:15,color:C.text}}>{s.l}</span></div>
        <span style={{color:C.muted}}>›</span>
      </div>)}
      <button onClick={handleLogout} style={{width:"100%",background:C.bg,border:`1px solid ${C.coral}`,borderRadius:14,padding:14,fontSize:15,color:C.coral,cursor:"pointer",marginTop:8}}>登出</button>
    </div>
  </div>;
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("home");
  const [sel, setSel] = useState(null);
  const [selCat, setSelCat] = useState("");
  const [products, setProducts] = useState([]);

  useEffect(()=>{
    supabase.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user || null);
      setLoading(false);
    });
    const {data:{subscription}} = supabase.auth.onAuthStateChange((_,session)=>{
      setUser(session?.user || null);
    });
    return ()=>subscription.unsubscribe();
  },[]);

  const loadProducts = async () => {
    const {data} = await supabase.from("products").select("*, price_records(*)").order("created_at",{ascending:false});
    if(data) setProducts(data);
  };

  useEffect(()=>{ if(user) loadProducts(); },[user]);

  if(loading) return <div style={{minHeight:"100vh",background:C.teal,display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{textAlign:"center"}}>
      <div style={{fontSize:32,fontWeight:900,color:"#fff",marginBottom:8}}>價記</div>
      <div style={{fontSize:16,color:C.yellow}}>PriceMemo</div>
    </div>
  </div>;

  if(!user) return <LoginScreen onLogin={setUser}/>;

  if(sel) return <div style={{maxWidth:430,margin:"0 auto",fontFamily:"'PingFang HK','Noto Sans HK',system-ui,sans-serif",minHeight:"100vh"}}>
    <ProductDetail product={sel} onBack={()=>setSel(null)} user={user} onUpdate={updated=>{setProducts(products.map(p=>p.id===updated.id?updated:p));}}/>
  </div>;

  return <div style={{maxWidth:430,margin:"0 auto",fontFamily:"'PingFang HK','Noto Sans HK',system-ui,sans-serif",background:C.bg,minHeight:"100vh",paddingBottom:80}}>
    {tab==="home"&&<HomeScreen products={products} setSelectedProduct={setSel} setTab={setTab} selectedCat={selCat} setSelectedCat={setSelCat}/>}
    {tab==="search"&&<SearchScreen products={products} setSelectedProduct={setSel}/>}
    {tab==="add"&&<AddScreen user={user} onAdded={()=>{loadProducts();setTab("home");}}/>}
    {tab==="bookmarks"&&<BookmarksScreen products={products} setSelectedProduct={setSel} user={user}/>}
    {tab==="profile"&&<ProfileScreen user={user} products={products} onLogout={()=>setUser(null)}/>}
    <BottomNav tab={tab} setTab={setTab}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
