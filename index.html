function freshness(date, cat) {
  const days = Math.floor((Date.now()-new Date(date).getTime())/86400000);
  const isFresh = cat==="fresh";
  if(isFresh){ if(days<=1)return{color:C.green,label:days===0?"今日":"昨日",dot:"🟢"}; if(days<=3)return{color:C.yellow,label:`${days}日前`,dot:"🟡"}; return{color:C.coral,label:`${days}日前`,dot:"🔴"}; }
  if(days<=7)return{color:C.green,label:days===0?"今日":`${days}日前`,dot:"🟢"};
  if(days<=30)return{color:C.yellow,label:`${days}日前`,dot:"🟡"};
  return{color:C.coral,label:`${days}日前`,dot:"🔴"};
}
const getBest = prices => prices.length ? Math.min(...prices.map(p=>p.price)) : 0;

// ── SET DISPLAY NAME ─────────────────────────────────────────────────────────
function SetDisplayNameScreen({user, onDone}){
  const suggested = user?.user_metadata?.full_name || user?.email?.split("@")[0] || "";
  const [name, setName] = useState(suggested);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  const handleSave = async () => {
    if(!name.trim()){setError("請輸入顯示名稱");return;}
    setSaving(true);
    const {error} = await supabase.auth.updateUser({data:{display_name: name.trim()}});
    if(error){setError("儲存失敗，請重試");setSaving(false);return;}
    onDone(name.trim());
  };

  return <div style={{minHeight:"100vh",background:C.teal,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"48px 28px"}}>
    <div style={{width:"100%",maxWidth:340}}>

        <div style={{fontSize:20,fontWeight:800,color:"#fff",marginBottom:8}}>你想叫咩名？</div>
        <div style={{fontSize:14,color:"rgba(255,255,255,0.65)",lineHeight:1.6}}>其他用戶睇你的價格記錄時會見到呢個名。唔需要用真實姓名，花名英文名都得！</div>
      </div>

      <div style={{background:"rgba(255,255,255,0.1)",borderRadius:14,padding:"16px 20px",marginBottom:8}}>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Pinky、阿明、匿名用戶" maxLength={20}
          style={{width:"100%",background:"none",border:"none",outline:"none",fontSize:20,fontWeight:700,color:"#fff",textAlign:"center",boxSizing:"border-box"}}/>
      </div>
      <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",textAlign:"center",marginBottom:24}}>最多20個字元</div>

      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>

        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>

// ── LOGIN SCREEN ──────────────────────────────────────────────────────────────
function LoginScreen(){
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [mode, setMode] = useState("main"); // main | email-login | email-register
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [displayName, setDisplayName] = useState("");

  const handleGoogleLogin = async () => {
    setLoading(true); setError("");
    const {error} = await supabase.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.origin}});
    if(error){setError(error.message);setLoading(false);}
  };

  const handleEmailLogin = async () => {
    setLoading(true); setError("");
    const {error} = await supabase.auth.signInWithPassword({email, password});
    if(error){setError("電郵或密碼錯誤，請重試");setLoading(false);}
  };

  const handleEmailRegister = async () => {
    if(!displayName.trim()){setError("請輸入顯示名稱");return;}
    setLoading(true); setError("");
    const {data, error} = await supabase.auth.signUp({email, password, options:{data:{full_name:displayName}}});
    if(error){setError(error.message);setLoading(false);return;}
    if(data?.user){
      // 直接登入成功，唔需要確認電郵
      setLoading(false);
    } else {
      setError("註冊失敗，請重試");
      setLoading(false);
    }
  };

  const inputStyle = {width:"100%",border:"none",borderBottom:"1px solid rgba(255,255,255,0.3)",outline:"none",fontSize:16,color:"#fff",background:"transparent",padding:"10px 0",boxSizing:"border-box",marginBottom:16};

  if(mode==="email-login") return <div style={{minHeight:"100vh",background:C.teal,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"48px 28px"}}>
    <div style={{width:"100%",maxWidth:340}}>
      <button onClick={()=>setMode("main")} style={{background:"none",border:"none",color:"rgba(255,255,255,0.7)",cursor:"pointer",fontSize:14,marginBottom:24,padding:0}}>← 返回</button>
      <div style={{fontSize:20,fontWeight:800,color:"#fff",marginBottom:28}}>電郵登入</div>
      <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="電郵地址" type="email" style={inputStyle}/>
      <input value={password} onChange={e=>setPassword(e.target.value)} placeholder="密碼" type="password" style={inputStyle}/>
      {error&&<div style={{color:C.coral,fontSize:13,marginBottom:12}}>{error}</div>}
      <button onClick={handleEmailLogin} disabled={loading||!email||!password} style={{width:"100%",background:C.yellow,border:"none",borderRadius:14,padding:16,fontSize:16,fontWeight:700,color:C.teal,cursor:"pointer",marginBottom:12,opacity:loading||!email||!password?0.6:1}}>{loading?"登入中...":"登入"}</button>
      <button onClick={()=>setMode("email-register")} style={{width:"100%",background:"rgba(255,255,255,0.1)",border:"none",borderRadius:14,padding:14,fontSize:15,color:"#fff",cursor:"pointer"}}>未有帳號？立即註冊</button>
    </div>
  </div>;

  if(mode==="email-register") return <div style={{minHeight:"100vh",background:C.teal,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"48px 28px"}}>
    <div style={{width:"100%",maxWidth:340}}>
      <button onClick={()=>setMode("email-login")} style={{background:"none",border:"none",color:"rgba(255,255,255,0.7)",cursor:"pointer",fontSize:14,marginBottom:24,padding:0}}>← 返回</button>
      <div style={{fontSize:20,fontWeight:800,color:"#fff",marginBottom:28}}>建立帳號</div>
      <input value={displayName} onChange={e=>setDisplayName(e.target.value)} placeholder="顯示名稱（其他用戶會見到）" style={inputStyle}/>
      <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="電郵地址" type="email" style={inputStyle}/>
      <input value={password} onChange={e=>setPassword(e.target.value)} placeholder="密碼（最少6位）" type="password" style={inputStyle}/>
      {error&&<div style={{color:C.coral,fontSize:13,marginBottom:12}}>{error}</div>}
      <button onClick={handleEmailRegister} disabled={loading||!email||!password||!displayName} style={{width:"100%",background:C.yellow,border:"none",borderRadius:14,padding:16,fontSize:16,fontWeight:700,color:C.teal,cursor:"pointer",opacity:loading||!email||!password||!displayName?0.6:1}}>{loading?"註冊中...":"建立帳號"}</button>
    </div>
  </div>;

  return <div style={{minHeight:"100vh",background:C.teal,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"48px 32px"}}>
    <div style={{textAlign:"center",width:"100%",maxWidth:340}}>
      <img src="FullName.png" alt="價記 PriceMemo" style={{width:150,height:150,objectFit:"contain",marginBottom:16}}/>
      <div style={{fontSize:22,fontWeight:800,color:"#fff",marginBottom:6}}>記住邊度買過幾錢</div>
      <div style={{fontSize:22,fontWeight:800,color:C.yellow,marginBottom:24}}>下次先知抵唔抵</div>
      <div style={{display:"flex",flexDirection:"column",gap:12,textAlign:"left",background:"rgba(255,255,255,0.08)",borderRadius:16,padding:"20px 24px",marginBottom:24}}>
        {["📍 記錄唔同地點見過的價格","🔍 即時比較歷史最低價","🎁 追蹤優惠同到期日","🛒 涵蓋超市、藥房、街市等"].map(t=><div key={t} style={{fontSize:15,color:"rgba(255,255,255,0.9)"}}>{t}</div>)}
      </div>
      <button onClick={handleGoogleLogin} disabled={loading} style={{width:"100%",background:C.white,border:"none",borderRadius:16,padding:"16px 24px",display:"flex",alignItems:"center",justifyContent:"center",gap:12,cursor:loading?"not-allowed":"pointer",opacity:loading?0.7:1,boxShadow:"0 4px 20px rgba(0,0,0,0.15)",marginBottom:12}}>

          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span style={{fontSize:16,fontWeight:700,color:C.text}}>{loading?"登入中...":"用 Google 帳號登入"}</span>
      </button>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <div style={{flex:1,height:1,background:"rgba(255,255,255,0.2)"}}/>
        <span style={{fontSize:13,color:"rgba(255,255,255,0.5)"}}>或者</span>
        <div style={{flex:1,height:1,background:"rgba(255,255,255,0.2)"}}/>
      </div>
      <button onClick={()=>setMode("email-login")} style={{width:"100%",background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:16,padding:"14px 24px",fontSize:15,fontWeight:600,color:"#fff",cursor:"pointer"}}>📧 用電郵登入 / 註冊</button>
      {error&&<div style={{marginTop:12,background:"rgba(233,112,85,0.15)",borderRadius:12,padding:12,textAlign:"center",color:C.coral,fontSize:14}}>{error}</div>}
    </div>
  </div>;
}

// ── PRODUCT CARD ──────────────────────────────────────────────────────────────
function ProductCard({product,onClick,bookmarkIds,onToggleBookmark}){
  const prices=product.price_records||[];
  const best=getBest(prices);
  const latest=prices.length?[...prices].sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at))[0]:null;
  const f=latest?freshness(latest.recorded_at,product.category):null;
  const cat=CATEGORIES.find(c=>c.id===product.category);
  const hasPromo=prices.some(p=>p.promo&&p.promo_expiry&&new Date(p.promo_expiry)>new Date());
  const isBookmarked=bookmarkIds&&bookmarkIds.includes(product.id);

  return <div style={{background:C.white,borderRadius:16,padding:16,marginBottom:10,boxShadow:"0 2px 8px rgba(23,107,104,0.07)",border:"1px solid #EAE8E3"}}>
    <div onClick={onClick} style={{cursor:"pointer"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4,flexWrap:"wrap"}}>
            <span>{cat?.emoji}</span>
            <span style={{fontSize:12,color:C.muted}}>{cat?.label}</span>
            {product.brand&&<span style={{fontSize:12,background:C.tealLight,color:C.teal,borderRadius:6,padding:"1px 7px",fontWeight:600}}>{product.brand}</span>}
            {hasPromo&&<span style={{fontSize:11,background:C.coral,color:"#fff",borderRadius:6,padding:"1px 6px",fontWeight:600}}>優惠</span>}
          </div>
          <div style={{fontSize:16,fontWeight:700,color:C.text,marginBottom:4}}>{product.name}</div>
          {latest&&f&&<div style={{fontSize:12,color:f.color}}>{f.dot} {f.label} · {latest.shop}</div>}
          {!latest&&<div style={{fontSize:12,color:C.muted}}>未有價格記錄</div>}
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8,minWidth:70}}>
          {prices.length>0&&<div style={{textAlign:"right"}}>
            <div style={{fontSize:22,fontWeight:800,color:C.teal}}>${best}</div>
            <div style={{fontSize:11,color:C.muted}}>最低價</div>
          </div>}
          {onToggleBookmark&&<button onClick={e=>{e.stopPropagation();onToggleBookmark(product.id);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,opacity:isBookmarked?1:0.25,transition:"opacity 0.2s",padding:0}}>🔖</button>}
        </div>
      </div>
    </div>
  </div>;
}

// ── EDIT FORM ─────────────────────────────────────────────────────────────────

    <div style={{fontWeight:700,color:C.teal,marginBottom:12}}>✏️ 編輯記錄</div>
    {[["price","價格 ($)","number"],["shop","店鋪名","text"],["district","地區（選填）","text"]].map(([k,l,t])=><div key={k} style={{marginBottom:10}}>
      <div style={{fontSize:12,color:C.muted,marginBottom:4}}>{l}</div>
      <input type={t} value={f[k]} onChange={e=>u(k,t==="number"?Number(e.target.value):e.target.value)} style={{width:"100%",border:`1px solid ${C.teal}`,borderRadius:8,padding:"8px 10px",fontSize:15,outline:"none",boxSizing:"border-box"}}/>

      <div style={{fontSize:12,color:C.muted,marginBottom:4}}>優惠（留空即無）</div>
      <input value={f.promo} onChange={e=>u("promo",e.target.value)} placeholder="e.g. 買一送一" style={{width:"100%",border:`1px solid ${C.teal}`,borderRadius:8,padding:"8px 10px",fontSize:15,outline:"none",boxSizing:"border-box"}}/>
    </div>
    {f.promo&&<div style={{marginBottom:10}}>
      <div style={{fontSize:12,color:C.muted,marginBottom:4}}>優惠到期日</div>
      <input type="date" value={f.promoExpiry} onChange={e=>u("promoExpiry",e.target.value)} style={{width:"100%",border:`1px solid ${C.teal}`,borderRadius:8,padding:"8px 10px",fontSize:14,outline:"none",boxSizing:"border-box",maxWidth:"100%"}}/>

// ── PRODUCT DETAIL ────────────────────────────────────────────────────────────
function ProductDetail({product:init,onBack,user,onUpdate,setTab,setAddProduct}){
  const [product,setProduct]=useState(init);
  const [editingPrice,setEditingPrice]=useState(null);
  const [confirmDelete,setConfirmDelete]=useState(null);
  const [loading,setLoading]=useState(false);
  const cat=CATEGORIES.find(c=>c.id===product.category);
  const prices=product.price_records||[];
  const best=getBest(prices);
  const display=[...prices].sort((a,b)=>a.price-b.price);

  const deletePrice=async(id)=>{
    setLoading(true);
    await supabase.from("price_records").delete().eq("id",id);
    const updated={...product,price_records:prices.filter(p=>p.id!==id)};
    setProduct(updated);onUpdate(updated);setConfirmDelete(null);setLoading(false);
  };
  const saveEdit=async(id,data)=>{
    setLoading(true);
    const {data:updated}=await supabase.from("price_records").update({price:data.price,shop:data.shop,district:data.district,promo:data.promo,promo_expiry:data.promoExpiry||null}).eq("id",id).select().single();
    if(updated){const np=prices.map(p=>p.id===id?{...p,...updated}:p);const np2={...product,price_records:np};setProduct(np2);onUpdate(np2);}
    setEditingPrice(null);setLoading(false);
  };

  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={{background:C.teal,padding:"52px 20px 20px"}}>
      <button onClick={onBack} style={{background:"none",border:"none",color:"#fff",fontSize:15,cursor:"pointer",marginBottom:10,padding:0}}>← 返回</button>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{flex:1}}>
          {product.brand&&<div style={{fontSize:13,color:C.yellow,marginBottom:2,fontWeight:700}}>{product.brand}</div>}
          <div style={{fontSize:13,color:"rgba(255,255,255,0.65)"}}>{cat?.emoji} {cat?.label}</div>
          <div style={{fontSize:19,fontWeight:800,color:"#fff",marginTop:2}}>{product.name}</div>
        </div>
        {prices.length>0&&<div style={{textAlign:"right"}}>
          <div style={{fontSize:30,fontWeight:900,color:C.yellow}}>${best}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.65)"}}>最低見過</div>
        </div>}
      </div>
    </div>
    <div style={{padding:16}}>
      <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:10}}>價格記錄 ({display.length})</div>
      {display.map(p=>{
        const f=freshness(p.recorded_at,product.category);
        const promoActive=p.promo&&p.promo_expiry&&new Date(p.promo_expiry)>new Date();
        const promoExpired=p.promo&&p.promo_expiry&&new Date(p.promo_expiry)<=new Date();
        const isBest=p.price===best;
        const isMe=user&&p.user_id===user.id;
        if(editingPrice===p.id)return <EditForm key={p.id} price={p} onSave={d=>saveEdit(p.id,d)} onCancel={()=>setEditingPrice(null)}/>;
        if(confirmDelete===p.id)return <div key={p.id} style={{background:"#FFF0EE",borderRadius:14,padding:16,marginBottom:10,border:`2px solid ${C.coral}`}}>
          <div style={{fontWeight:700,color:C.text,marginBottom:4}}>確定刪除？</div>
          <div style={{fontSize:14,color:C.muted,marginBottom:14}}>{p.shop} · ${p.price}</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setConfirmDelete(null)} style={{flex:1,background:C.bg,border:"none",borderRadius:10,padding:10,cursor:"pointer"}}>取消</button>
            <button onClick={()=>deletePrice(p.id)} disabled={loading} style={{flex:1,background:C.coral,border:"none",borderRadius:10,padding:10,cursor:"pointer",color:"#fff",fontWeight:700}}>刪除</button>
          </div>
        </div>;
        return <div key={p.id} style={{background:C.white,borderRadius:14,padding:14,marginBottom:10,border:isBest?`2px solid ${C.teal}`:"1px solid #EAE8E3"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3,flexWrap:"wrap"}}>
                <span style={{fontWeight:700,fontSize:15,color:C.text}}>{p.shop}</span>
                {isBest&&<span style={{fontSize:11,background:C.teal,color:"#fff",borderRadius:6,padding:"1px 7px"}}>最平</span>}
              </div>
              {p.district&&<div style={{fontSize:12,color:C.muted,marginBottom:2}}>📍 {p.district}</div>}
              <div style={{fontSize:12,color:C.muted,marginBottom:3}}>👤 {p.user_name}</div>
              <div style={{fontSize:12,color:f.color}}>{f.dot} {f.label}</div>
              {promoActive&&<div style={{fontSize:12,color:C.coral,marginTop:3,fontWeight:600}}>🎁 {p.promo} · 至 {new Date(p.promo_expiry).toLocaleDateString("zh-HK")}</div>}
              {promoExpired&&<div style={{fontSize:12,color:C.muted,marginTop:3}}>⏰ {p.promo}（已過期）</div>}
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
              <div style={{fontSize:24,fontWeight:800,color:isBest?C.teal:C.text}}>${p.price}</div>
              <div style={{display:"flex",gap:6}}>
                {isMe?<>
                  <button onClick={()=>setEditingPrice(p.id)} style={{background:C.tealLight,border:"none",borderRadius:8,padding:"4px 10px",cursor:"pointer",fontSize:12,color:C.teal}}>✏️</button>
                  <button onClick={()=>setConfirmDelete(p.id)} style={{background:"#FFF0EE",border:"none",borderRadius:8,padding:"4px 10px",cursor:"pointer",fontSize:12,color:C.coral}}>🗑️</button>
                </>:<button onClick={()=>alert("已收到檢舉，感謝！")} style={{background:C.bg,border:"none",borderRadius:8,padding:"4px 10px",cursor:"pointer",fontSize:12,color:C.muted}}>🚩</button>}
              </div>
            </div>
          </div>
        </div>;
      })}
      <button onClick={()=>{setAddProduct(product);onBack();setTab("add");}} style={{width:"100%",background:C.yellow,border:"none",borderRadius:14,padding:16,fontSize:16,fontWeight:700,color:C.teal,cursor:"pointer",marginTop:4}}>＋ 加入新價格記錄</button>
      {user&&product.created_by===user.id&&prices.length===0&&<button onClick={async()=>{if(window.confirm("確定刪除整個產品？")){await supabase.from("products").delete().eq("id",product.id);onUpdate(null);onBack();}}} style={{width:"100%",background:"#FFF0EE",border:`1px solid ${C.coral}`,borderRadius:14,padding:14,fontSize:14,color:C.coral,cursor:"pointer",marginTop:8}}>🗑️ 刪除整個產品</button>}
    </div>
  </div>;
}

// ── ADD SCREEN ────────────────────────────────────────────────────────────────
function AddScreen({user,displayName,onAdded,prefillProduct,clearPrefill}){
  const [step,setStep]=useState(prefillProduct?2:1);
  const [saving,setSaving]=useState(false);
  const [success,setSuccess]=useState(false);
  const [f,setF]=useState({
    name:prefillProduct?.name||"",
    brand:prefillProduct?.brand||"",
    category:prefillProduct?.category||"",
    productId:prefillProduct?.id||null,
    shopType:"",shopName:"",district:"",
    price:"",promo:false,promoType:"",promoExpiry:""
  });
  const u=(k,v)=>setF(p=>({...p,[k]:v}));

  useEffect(()=>{
    if(prefillProduct){
      setF(p=>({...p,name:prefillProduct.name,brand:prefillProduct.brand||"",category:prefillProduct.category,productId:prefillProduct.id}));
      setStep(2);
    }
  },[prefillProduct]);

  const handleSave=async()=>{
    setSaving(true);
    try{
      let productId=f.productId;
      if(!productId){
        const {data:existing}=await supabase.from("products").select("id").eq("name",f.name).eq("brand",f.brand||"").maybeSingle();
        if(existing){productId=existing.id;}
        else{const {data:np}=await supabase.from("products").insert({name:f.name,brand:f.brand||null,category:f.category}).select().single();productId=np.id;}
      }
      await supabase.from("price_records").insert({
        product_id:productId,user_id:user.id,
        user_name:displayName||user.user_metadata?.display_name||user.user_metadata?.full_name||user.email,
        price:Number(f.price),district:f.district||null,
        shop:f.shopName||f.shopType,
        promo:f.promo?f.promoType:null,
        promo_expiry:f.promo&&f.promoExpiry?f.promoExpiry:null,
      });
      setSuccess(true);
      clearPrefill();
      onAdded();
      setTimeout(()=>{setSuccess(false);setStep(1);setF({name:"",brand:"",category:"",productId:null,shopType:"",shopName:"",district:"",price:"",promo:false,promoType:"",promoExpiry:""});},1500);
    }catch(e){alert("儲存失敗，請重試");}
    setSaving(false);
  };

  if(success)return <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
    <div style={{fontSize:60,marginBottom:16}}>✅</div>
    <div style={{fontSize:20,fontWeight:700,color:C.teal}}>記錄成功！</div>
  </div>;

  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={{background:C.teal,padding:"52px 20px 20px"}}>
      <div style={{fontSize:19,fontWeight:800,color:"#fff",marginBottom:12}}>{prefillProduct?"加入新價格記錄":"記錄價格"}</div>
      <div style={{display:"flex",gap:6,marginBottom:6}}>
        {[1,2,3].map(s=><div key={s} style={{flex:1,height:4,borderRadius:2,background:s<=step?C.yellow:"rgba(255,255,255,0.25)"}}/>)}
      </div>
      <div style={{fontSize:12,color:"rgba(255,255,255,0.65)"}}>{["第1步：產品資料","第2步：店鋪資料","第3步：價格詳情"][step-1]}</div>
    </div>
    <div style={{padding:16}}>
      {step===1&&<div>
        {prefillProduct?<div style={{background:C.tealLight,borderRadius:14,padding:14,marginBottom:14}}>
          <div style={{fontSize:13,color:C.teal,fontWeight:700}}>{prefillProduct.name}</div>
        </div>:<>
          {[["name","產品名稱","e.g. 蘇打水 12罐"],["brand","品牌（選填）","e.g. 彩明"]].map(([k,l,ph])=><div key={k} style={{background:C.white,borderRadius:14,padding:14,marginBottom:10}}>
            <div style={{fontSize:13,color:C.muted,marginBottom:6}}>{l}</div>
            <input value={f[k]} onChange={e=>u(k,e.target.value)} placeholder={ph} style={{width:"100%",border:"none",outline:"none",fontSize:16,color:C.text,background:"transparent",boxSizing:"border-box"}}/>
          </div>)}
          <div style={{background:C.white,borderRadius:14,padding:14,marginBottom:20}}>
            <div style={{fontSize:13,color:C.muted,marginBottom:10}}>分類</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
              {CATEGORIES.map(c=><button key={c.id} onClick={()=>u("category",c.id)} style={{padding:"7px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:13,background:f.category===c.id?C.teal:C.bg,color:f.category===c.id?"#fff":C.text,fontWeight:f.category===c.id?700:400}}>{c.emoji} {c.label}</button>)}
            </div>
          </div>
        </>}
        <button onClick={()=>setStep(2)} disabled={!prefillProduct&&(!f.name||!f.category)} style={{width:"100%",background:prefillProduct||(f.name&&f.category)?C.yellow:"#ccc",border:"none",borderRadius:14,padding:16,fontSize:16,fontWeight:700,color:C.teal,cursor:"pointer"}}>下一步 →</button>
      </div>}

      {step===2&&<div>
        {/* Shop Type */}
        <div style={{background:C.white,borderRadius:14,padding:14,marginBottom:10}}>
          <div style={{fontSize:13,color:C.muted,marginBottom:10}}>店鋪類型</div>
          {CHAIN_STORES.map(cs=><div key={cs.type} style={{marginBottom:8}}>
            <div style={{fontSize:11,color:C.muted,marginBottom:6,fontWeight:600}}>{cs.type}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {cs.stores.map(s=><button key={s} onClick={()=>u("shopType",s)} style={{padding:"6px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:13,background:f.shopType===s?C.teal:C.bg,color:f.shopType===s?"#fff":C.text}}>{s}</button>)}
            </div>
          </div>)}
        </div>
        {/* Shop Name */}
        <div style={{background:C.white,borderRadius:14,padding:14,marginBottom:10}}>
          <div style={{fontSize:13,color:C.muted,marginBottom:6}}>
            {f.shopType==="其他地方"?"請輸入地方名稱":f.shopType?`${f.shopType} - 分店名稱`:"店鋪名稱"}
          </div>
          <input value={f.shopName} onChange={e=>u("shopName",e.target.value)}
            placeholder={f.shopType==="其他地方"?"e.g. 城門河邊士多、學校福利社":f.shopType?`e.g. ${f.shopType}旺角店`:"e.g. 旺角百佳、沙田惠康"}
            style={{width:"100%",border:"none",outline:"none",fontSize:15,color:C.text,background:"transparent",boxSizing:"border-box"}}/>
        </div>
        {/* District - optional */}
        <div style={{background:C.white,borderRadius:14,padding:14,marginBottom:20}}>
          <div style={{fontSize:13,color:C.muted,marginBottom:6}}>地區（選填）</div>
          <input value={f.district} onChange={e=>u("district",e.target.value)} placeholder="e.g. 旺角、將軍澳、沙田" style={{width:"100%",border:"none",outline:"none",fontSize:15,color:C.text,background:"transparent",boxSizing:"border-box"}}/>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setStep(1)} style={{flex:1,background:C.bg,border:"none",borderRadius:14,padding:16,fontSize:15,color:C.text,cursor:"pointer"}}>← 返回</button>
          <button onClick={()=>(f.shopName||f.shopType)&&setStep(3)} style={{flex:2,background:(f.shopName||f.shopType)?C.yellow:"#ccc",border:"none",borderRadius:14,padding:16,fontSize:16,fontWeight:700,color:C.teal,cursor:(f.shopName||f.shopType)?"pointer":"not-allowed"}}>下一步 →</button>
        </div>
      </div>}

      {step===3&&<div>
        <div style={{background:C.white,borderRadius:14,padding:14,marginBottom:10}}>
          <div style={{fontSize:13,color:C.muted,marginBottom:6}}>價格 ($)</div>
          <input type="number" value={f.price} onChange={e=>u("price",e.target.value)} placeholder="0" style={{width:"100%",border:"none",outline:"none",fontSize:32,fontWeight:800,color:C.teal,background:"transparent",boxSizing:"border-box"}}/>
        </div>
        <div style={{background:C.white,borderRadius:14,padding:14,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:f.promo?12:0}}>
            <span style={{fontSize:15,fontWeight:600,color:C.text}}>有優惠？</span>
            <button onClick={()=>u("promo",!f.promo)} style={{width:44,height:26,borderRadius:13,border:"none",cursor:"pointer",background:f.promo?C.coral:"#ccc",position:"relative"}}>
              <div style={{width:20,height:20,borderRadius:10,background:"#fff",position:"absolute",top:3,left:f.promo?21:3,transition:"left 0.2s"}}/>
            </button>
          </div>
          {f.promo&&<div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
              {["特價","買一送一","第二件半價","限時優惠"].map(t=><button key={t} onClick={()=>u("promoType",t)} style={{padding:"6px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:13,background:f.promoType===t?C.coral:C.bg,color:f.promoType===t?"#fff":C.text}}>{t}</button>)}
            </div>
            <div style={{fontSize:13,color:C.muted,marginBottom:6}}>優惠到期日</div>
            <input type="date" value={f.promoExpiry} onChange={e=>u("promoExpiry",e.target.value)} style={{width:"100%",border:"1px solid #EAE8E3",borderRadius:10,padding:"8px 12px",fontSize:14,outline:"none",boxSizing:"border-box",maxWidth:"100%"}}/>
          </div>}
        </div>
        {/* Summary */}
        <div style={{background:C.tealLight,borderRadius:14,padding:14,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:C.teal,marginBottom:8}}>確認記錄</div>
          {[["產品",`${f.brand?f.brand+" · ":""}${f.name}`],["店鋪",f.shopName||f.shopType||"-"],["地區",f.district||"（未填）"],["價格",f.price?`$${f.price}`:"-"]].map(([l,v])=><div key={l} style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
            <span style={{color:C.muted}}>{l}</span>
            <span style={{color:C.text,fontWeight:600}}>{v}</span>
          </div>)}
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setStep(2)} style={{flex:1,background:C.bg,border:"none",borderRadius:14,padding:16,fontSize:15,color:C.text,cursor:"pointer"}}>← 返回</button>
          <button onClick={handleSave} disabled={!f.price||saving} style={{flex:2,background:f.price&&!saving?C.teal:"#ccc",border:"none",borderRadius:14,padding:16,fontSize:16,fontWeight:700,color:"#fff",cursor:f.price&&!saving?"pointer":"not-allowed"}}>{saving?"儲存中...":"✅ 儲存記錄"}</button>
        </div>
      </div>}
    </div>
  </div>;
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function SearchScreen({products,setSelectedProduct,bookmarkIds,onToggleBookmark}){
  const [q,setQ]=useState("");
  const [fCat,setFCat]=useState("");
  const [sort,setSort]=useState("name");
  let filtered=products.filter(p=>(p.name.toLowerCase().includes(q.toLowerCase())||(p.brand&&p.brand.toLowerCase().includes(q.toLowerCase())))&&(fCat===""||p.category===fCat));
  if(sort==="price")filtered.sort((a,b)=>getBest(a.price_records||[])-getBest(b.price_records||[]));
  if(sort==="name")filtered.sort((a,b)=>a.name.localeCompare(b.name));
  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={{background:C.teal,padding:"52px 20px 16px"}}>
      <div style={{fontSize:19,fontWeight:800,color:"#fff",marginBottom:12}}>搜尋產品</div>
      <div style={{background:"rgba(255,255,255,0.15)",borderRadius:12,display:"flex",alignItems:"center",padding:"10px 14px",gap:8}}>
        <span style={{color:"rgba(255,255,255,0.6)"}}>🔍</span>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="搜尋產品名 / 品牌..." style={{background:"none",border:"none",outline:"none",color:"#fff",fontSize:16,flex:1}}/>
      </div>
    </div>
    <div style={{background:C.white,padding:"10px 12px",borderBottom:"1px solid #EAE8E3"}}>
      <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:8}}>
        <button onClick={()=>setFCat("")} style={{padding:"6px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:12,whiteSpace:"nowrap",background:fCat===""?C.teal:C.bg,color:fCat===""?"#fff":C.text}}>全部</button>
        {CATEGORIES.map(c=><button key={c.id} onClick={()=>setFCat(c.id)} style={{padding:"6px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:12,whiteSpace:"nowrap",background:fCat===c.id?C.teal:C.bg,color:fCat===c.id?"#fff":C.text}}>{c.emoji} {c.label}</button>)}
      </div>
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <span style={{fontSize:12,color:C.muted}}>排序：</span>
        {[["name","名稱"],["price","最低價"]].map(([v,l])=><button key={v} onClick={()=>setSort(v)} style={{padding:"5px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:12,background:sort===v?C.teal:C.bg,color:sort===v?"#fff":C.text}}>{l}</button>)}
      </div>
    </div>
    <div style={{padding:"12px 16px"}}>
      {filtered.length===0?<div style={{textAlign:"center",padding:40,color:C.muted}}><div style={{fontSize:36,marginBottom:10}}>🔍</div>冇搵到相關產品</div>:filtered.map(p=><ProductCard key={p.id} product={p} onClick={()=>setSelectedProduct(p)} bookmarkIds={bookmarkIds} onToggleBookmark={onToggleBookmark}/>)}
    </div>
  </div>;
}

// ── BOOKMARKS ─────────────────────────────────────────────────────────────────
function BookmarksScreen({products,setSelectedProduct,bookmarkIds,toggleBookmark}){
  const [loading,setLoading]=useState(false);
  const bm=products.filter(p=>bookmarkIds.includes(p.id));

  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={{background:C.teal,padding:"52px 20px 24px"}}>
      <div style={{fontSize:19,fontWeight:800,color:"#fff"}}>常買清單 🔖</div>
      <div style={{fontSize:13,color:"rgba(255,255,255,0.65)",marginTop:4}}>撳產品右上角 🔖 可加入／移除</div>
    </div>
    <div style={{padding:16}}>
      {loading?<div style={{textAlign:"center",padding:40,color:C.muted}}>載入中...</div>:
      bm.length===0?<div style={{textAlign:"center",padding:40,color:C.muted}}>
        <div style={{fontSize:36,marginBottom:10}}>🔖</div>
        <div style={{marginBottom:8}}>未有常買清單</div>
        <div style={{fontSize:13}}>去主頁撳產品右上角 🔖 加入</div>
      </div>:bm.map(p=><ProductCard key={p.id} product={p} onClick={()=>setSelectedProduct(p)} bookmarkIds={bookmarkIds} onToggleBookmark={toggleBookmark}/>)}
    </div>
  </div>;
}

// ── PROFILE ───────────────────────────────────────────────────────────────────
function ProfileScreen({user,displayName,onNameChange,onLogout}){
  const [changingName,setChangingName]=useState(false);
  const [newName,setNewName]=useState(displayName);
  const dispName=displayName||user?.user_metadata?.display_name||user?.user_metadata?.full_name||user?.email||"用戶";
  const [myRecords,setMyRecords]=useState([]);
  const [editingId,setEditingId]=useState(null);
  const [confirmDelete,setConfirmDelete]=useState(null);
  const [loading,setLoading]=useState(false);

  useEffect(()=>{
    if(!user)return;
    supabase.from("price_records").select("*, products(name,brand,category)").eq("user_id",user.id).order("recorded_at",{ascending:false}).then(({data})=>{if(data)setMyRecords(data);});
  },[user]);

  const handleLogout=async()=>{await supabase.auth.signOut();onLogout();};

  const deleteRecord=async(id)=>{
    setLoading(true);
    await supabase.from("price_records").delete().eq("id",id);
    setMyRecords(myRecords.filter(r=>r.id!==id));
    setConfirmDelete(null);setLoading(false);
  };

  const saveRecord=async(id,data)=>{
    setLoading(true);
    const {data:updated}=await supabase.from("price_records").update({price:data.price,shop:data.shop,district:data.district,promo:data.promo,promo_expiry:data.promoExpiry||null}).eq("id",id).select().single();
    if(updated)setMyRecords(myRecords.map(r=>r.id===id?{...r,...updated}:r));
    setEditingId(null);setLoading(false);
  };

  const avatar=user?.user_metadata?.avatar_url;

  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={{background:C.teal,padding:"52px 20px 28px"}}>
      <div style={{display:"flex",alignItems:"center",gap:16}}>
        {avatar?<img src={avatar} style={{width:64,height:64,borderRadius:32,objectFit:"cover"}} alt="avatar"/>:<div style={{width:64,height:64,borderRadius:32,background:C.yellow,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:800,color:C.teal}}>{displayName[0]}</div>}
        <div style={{flex:1}}>
          <div style={{fontSize:20,fontWeight:800,color:"#fff"}}>{dispName}</div>
          <div style={{fontSize:13,color:"rgba(255,255,255,0.65)",marginTop:2}}>{user?.email}</div>
          <button onClick={()=>setChangingName(true)} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,padding:"3px 10px",color:"#fff",fontSize:11,cursor:"pointer",marginTop:4}}>✏️ 改顯示名稱</button>
        </div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:20}}>
        {[{l:"我的記錄",v:myRecords.length},{l:"已記產品",v:new Set(myRecords.map(r=>r.product_id)).size}].map(s=><div key={s.l} style={{flex:1,background:"rgba(255,255,255,0.12)",borderRadius:12,padding:"10px 8px",textAlign:"center"}}>
          <div style={{fontSize:20,fontWeight:800,color:"#fff"}}>{s.v}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.65)"}}>{s.l}</div>
        </div>)}
      </div>
    </div>
    <div style={{padding:16}}>
      <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:10}}>我的記錄</div>
      {myRecords.length===0?<div style={{textAlign:"center",padding:30,color:C.muted}}>未有記錄</div>:myRecords.map((r,i)=>{
        const f=freshness(r.recorded_at,r.products?.category);
        const cat=CATEGORIES.find(c=>c.id===r.products?.category);
        if(editingId===r.id)return <EditForm key={r.id} price={{...r,district:r.district||""}} onSave={d=>saveRecord(r.id,d)} onCancel={()=>setEditingId(null)}/>;
        if(confirmDelete===r.id)return <div key={r.id} style={{background:"#FFF0EE",borderRadius:14,padding:16,marginBottom:10,border:`2px solid ${C.coral}`}}>
          <div style={{fontWeight:700,color:C.text,marginBottom:4}}>確定刪除？</div>
          <div style={{fontSize:14,color:C.muted,marginBottom:14}}>{r.shop} · ${r.price}</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setConfirmDelete(null)} style={{flex:1,background:C.bg,border:"none",borderRadius:10,padding:10,cursor:"pointer"}}>取消</button>
            <button onClick={()=>deleteRecord(r.id)} disabled={loading} style={{flex:1,background:C.coral,border:"none",borderRadius:10,padding:10,cursor:"pointer",color:"#fff",fontWeight:700}}>刪除</button>
          </div>
        </div>;
        return <div key={i} style={{background:C.white,borderRadius:14,padding:14,marginBottom:10,border:"1px solid #EAE8E3"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                <span style={{fontSize:12}}>{cat?.emoji}</span>
                {r.products?.brand&&<span style={{fontSize:12,background:C.tealLight,color:C.teal,borderRadius:6,padding:"1px 7px",fontWeight:600}}>{r.products.brand}</span>}
              </div>
              <div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:3}}>{r.products?.name}</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:2}}>🏪 {r.shop}{r.district?` · 📍${r.district}`:""}</div>
              <div style={{fontSize:12,color:f.color}}>{f.dot} {f.label}</div>
              {r.promo&&r.promo_expiry&&new Date(r.promo_expiry)>new Date()&&<div style={{fontSize:12,color:C.coral,marginTop:2,fontWeight:600}}>🎁 {r.promo}</div>}
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
              <div style={{fontSize:22,fontWeight:800,color:C.teal}}>${r.price}</div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>setEditingId(r.id)} style={{background:C.tealLight,border:"none",borderRadius:8,padding:"4px 10px",cursor:"pointer",fontSize:12,color:C.teal}}>✏️</button>
                <button onClick={()=>setConfirmDelete(r.id)} style={{background:"#FFF0EE",border:"none",borderRadius:8,padding:"4px 10px",cursor:"pointer",fontSize:12,color:C.coral}}>🗑️</button>
              </div>
            </div>
          </div>
        </div>;
      })}
      {changingName&&<div style={{background:C.white,borderRadius:14,padding:14,marginBottom:10,marginTop:10}}>
        <div style={{fontSize:13,color:C.muted,marginBottom:8}}>新顯示名稱</div>
        <input value={newName} onChange={e=>setNewName(e.target.value)} maxLength={20} style={{width:"100%",border:`1px solid ${C.teal}`,borderRadius:8,padding:"8px 10px",fontSize:16,outline:"none",boxSizing:"border-box",marginBottom:10}}/>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setChangingName(false)} style={{flex:1,background:C.bg,border:"none",borderRadius:10,padding:10,cursor:"pointer"}}>取消</button>
          <button onClick={async()=>{
            await supabase.auth.updateUser({data:{display_name:newName}});
            onNameChange(newName);
            localStorage.setItem(`nameset_${user.id}`,"true");
            setChangingName(false);
          }} style={{flex:2,background:C.teal,border:"none",borderRadius:10,padding:10,cursor:"pointer",color:"#fff",fontWeight:700}}>儲存</button>
        </div>
      </div>}
      <button onClick={handleLogout} style={{width:"100%",background:C.bg,border:`1px solid ${C.coral}`,borderRadius:14,padding:14,fontSize:15,color:C.coral,cursor:"pointer",marginTop:10}}>登出</button>
    </div>
  </div>;
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const [consented,setConsented]=useState(false);
  const [tab,setTab]=useState("home");
  const [sel,setSel]=useState(null);
  const [selCat,setSelCat]=useState("");
  const [products,setProducts]=useState([]);
  const [addProduct,setAddProduct]=useState(null);
  const [bookmarkIds,setBookmarkIds]=useState([]);
  const [displayName,setDisplayName]=useState("");
  const [nameSet,setNameSet]=useState(false);

  const loadBookmarks=async(uid)=>{
    const {data}=await supabase.from("bookmarks").select("product_id").eq("user_id",uid);
    if(data)setBookmarkIds(data.map(b=>b.product_id));
  };

  const toggleBookmark=async(productId)=>{
    if(!user)return;
    if(bookmarkIds.includes(productId)){
      await supabase.from("bookmarks").delete().eq("user_id",user.id).eq("product_id",productId);
      setBookmarkIds(bookmarkIds.filter(id=>id!==productId));
    } else {
      await supabase.from("bookmarks").insert({user_id:user.id,product_id:productId});
      setBookmarkIds([...bookmarkIds,productId]);
    }
  };

  useEffect(()=>{
    supabase.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user||null);
      setLoading(false);
    });
    const {data:{subscription}}=supabase.auth.onAuthStateChange((_,session)=>{setUser(session?.user||null);});
    return ()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(user){
      const stored=localStorage.getItem(`consented_${user.id}`);
      if(stored)setConsented(true);
      const dn=user?.user_metadata?.display_name||user?.user_metadata?.full_name||"";
      const nameStored=localStorage.getItem(`nameset_${user.id}`);
      if(dn&&nameStored){setDisplayName(dn);setNameSet(true);}
    }
  },[user]);

  const handleConsent=()=>{
    localStorage.setItem(`consented_${user.id}`,"true");
    setConsented(true);
  };

  const loadProducts=async()=>{
    const {data}=await supabase.from("products").select("*, price_records(*)").order("created_at",{ascending:false});
    if(data)setProducts(data);
  };

  useEffect(()=>{
    if(user&&consented){
      loadProducts();
      loadBookmarks(user.id);
    }
  },[user,consented]);

  if(loading)return <div style={{minHeight:"100vh",background:C.teal,display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{textAlign:"center"}}>
      <img src="FullName.png" alt="價記" style={{width:120,height:120,objectFit:"contain",marginBottom:12}}/>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
        <div style={{fontSize:16,color:C.yellow}}>載入中</div>
        <div style={{width:6,height:6,borderRadius:3,background:C.coral}}/>
      </div>
    </div>
  </div>;

  if(!user)return <LoginScreen/>;
  if(!consented)return <ConsentScreen onAgree={handleConsent}/>;
  if(!nameSet)return <SetDisplayNameScreen user={user} onDone={(n)=>{setDisplayName(n);setNameSet(true);localStorage.setItem(`nameset_${user.id}`,"true");}}/>;

  if(sel)return <div style={{maxWidth:430,margin:"0 auto",fontFamily:"'PingFang HK','Noto Sans HK',system-ui,sans-serif",minHeight:"100vh"}}>
    <ProductDetail product={sel} onBack={()=>setSel(null)} user={user} onUpdate={updated=>setProducts(products.map(p=>p.id===updated.id?updated:p))} setTab={setTab} setAddProduct={setAddProduct}/>
  </div>;

  return <div style={{maxWidth:430,margin:"0 auto",fontFamily:"'PingFang HK','Noto Sans HK',system-ui,sans-serif",background:C.bg,minHeight:"100vh",paddingBottom:80}}>
    {tab==="home"&&<HomeScreen products={products} setSelectedProduct={setSel} setTab={setTab} selectedCat={selCat} setSelectedCat={setSelCat} bookmarkIds={bookmarkIds} onToggleBookmark={toggleBookmark}/>}
    {tab==="search"&&<SearchScreen products={products} setSelectedProduct={setSel} bookmarkIds={bookmarkIds} onToggleBookmark={toggleBookmark}/>}
    {tab==="add"&&<AddScreen user={user} displayName={displayName} onAdded={()=>{loadProducts();setTab("home");}} prefillProduct={addProduct} clearPrefill={()=>setAddProduct(null)}/>}
    {tab==="bookmarks"&&<BookmarksScreen products={products} setSelectedProduct={setSel} bookmarkIds={bookmarkIds} toggleBookmark={toggleBookmark}/>}
    {tab==="profile"&&<ProfileScreen user={user} displayName={displayName} onNameChange={(n)=>{setDisplayName(n);}} onLogout={()=>{setUser(null);setConsented(false);setNameSet(false);setDisplayName("");}}/>}
    <BottomNav tab={tab} setTab={setTab}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
